# Envoy TLS configuration for QCobro.
#
# Terminates HTTPS on port 443 and routes to the apiserver (tRPC + REST)
# and webapp (React SPA) containers on the internal Docker network.
#
# Replace "app.qcobro.com" with your actual domain before deploying.
static_resources:
  listeners:
    - name: listener_https
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: auto
                stat_prefix: ingress_qcobro
                # Without this, Envoy rejects every WebSocket upgrade with a 403 during
                # the handshake — confirmed by connecting directly with a bare `ws`
                # client (no tRPC/SDK involved): 403 in ~200ms, before any app code
                # runs. This is what /trpc-ws (the realtime-streaming subscription
                # transport — agents:eval, campaigns.contactLog.onChange) rides on.
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: qcobro_route
                  virtual_hosts:
                    - name: qcobro
                      domains: ["*"]
                      routes:
                        # Pre-recorded voice sessions: Fonoster's AppBridge opens one
                        # signed WebSocket (wss://<host>/voice/session) per answered
                        # pre-recorded call. Upgraded over HTTP/1.1 to the embedded
                        # voice server; timeout 0 so a call is never cut short.
                        - match: { prefix: "/voice/session" }
                          route: { cluster: apiserver_voice, timeout: 0s }
                        # tRPC and REST API → apiserver. This prefix also covers /trpc-ws
                        # (the WebSocket transport for tRPC subscriptions, realtime-streaming
                        # capability) — Envoy's HTTP/1.1 router upgrades WebSocket connections
                        # automatically, no separate route or config needed.
                        - match: { prefix: "/trpc" }
                          route: { cluster: apiserver, timeout: 30s }
                        - match: { prefix: "/api" }
                          route: { cluster: apiserver, timeout: 30s }
                        # Everything else → webapp (React SPA via nginx)
                        - match: { prefix: "/" }
                          route: { cluster: webapp, timeout: 10s }
                      cors:
                        allow_origin_string_match:
                          - prefix: "*"
                        allow_methods: GET, PUT, DELETE, POST, OPTIONS
                        allow_headers: authorization,content-type,x-workspace,cache-control
                        max_age: "86400"
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                # Offer h2 in ALPN for clients that support it; browsers, REST
                # and WebSocket sessions fall back to HTTP/1.1.
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  # Certs are copied (dereferenced) into ./config/certs by the
                  # certbot renewal deploy-hook, because Docker userns-remap means
                  # the container cannot read Let's Encrypt's 0600/0700 tree directly.
                  - certificate_chain:
                      filename: "/etc/envoy/certs/fullchain.pem"
                    private_key:
                      filename: "/etc/envoy/certs/privkey.pem"

  clusters:
    - name: apiserver
      type: logical_dns
      connect_timeout: 20s
      lb_policy: round_robin
      load_assignment:
        cluster_name: apiserver
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: apiserver, port_value: 3000 }

    # Embedded pre-recorded voice server (WebSocket sessions, HTTP/1.1 upgrade). Port
    # must match apiserver.voicePort in qcobro.json (50061). Reachable over the internal
    # Docker network only — the port is not published on the host.
    - name: apiserver_voice
      type: logical_dns
      connect_timeout: 20s
      lb_policy: round_robin
      load_assignment:
        cluster_name: apiserver_voice
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: apiserver, port_value: 50061 }

    - name: webapp
      type: logical_dns
      connect_timeout: 20s
      lb_policy: round_robin
      load_assignment:
        cluster_name: webapp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: webapp, port_value: 80 }
