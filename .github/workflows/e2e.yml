name: e2e

on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".devcontainer/**"
      - "scripts/dev-config.mjs"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]

jobs:
  e2e:
    # Skip lerna's own bump commits — they only change version numbers and would
    # otherwise re-run e2e for nothing (mirrors the guard in test.yml).
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The same dev container developers use (.devcontainer/): initialize.sh writes .dev/
      # (config, keys, secrets) and builds the workspace image, which already has Chromium;
      # post-create.sh installs, migrates and seeds. ci-e2e.sh then starts the API and the
      # console and runs Playwright inside it.
      - name: Run e2e in the dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/ci-e2e.sh
          # Playwright's CI settings (retries, forbidOnly) inside the container.
          env: |
            CI

      - name: Upload report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
