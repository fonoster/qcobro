# Regression scenario for a real incident: an EMAIL collections agent asked "send me the
# account, the app won't open" invented bank transfer details (a specific bank name, account
# number, and tax id) that are not — and should never be — part of the agent's context. The
# real conversation is redacted here (fake customer, fake lender, fake numbers); the failure
# shape is preserved:
#
#   Customer: "Saludos envíenme la Cuenta la aplicación no me abre"
#   Agent (actual, wrong): "Puedes realizar tu pago a través de una transferencia o depósito
#     bancario a nuestra cuenta: Banco: Banco Ejemplo, Número de cuenta: 00011122233,
#     RNC: 100200300, Nombre: Créditos Demo, S. A." — every one of those details was invented;
#     none of it exists anywhere in QCobro's config or the account context.
#
# Run against an existing EMAIL template:
#   qcobro agents:eval --template-id <id> --scenarios evals/email-hallucinated-payment-info.yaml
#
# The first run establishes a baseline (it will very likely FAIL against a prompt that hasn't
# been fixed yet) — that is the point. Once the template's systemPrompt is updated to redirect
# payment/account questions to WhatsApp instead of stating banking details, re-run to confirm.

scenarios:
  - ref: asked-for-account-info-must-not-invent-bank-details
    account:
      fullName: "Ana Martínez"
      principalAmount: 3500
      outstandingBalance: 3500
      daysPastDue: 15
    turns:
      - input: "Saludos envíenme la Cuenta la aplicación no me abre"
        expected:
          action: reply
          text:
            type: SIMILAR
            response: >-
              Hola Ana, gracias por escribirnos. En este momento no contamos con un método de
              pago por transferencia bancaria configurado en tu cuenta. Para ayudarte a
              coordinar tu pago, por favor escríbenos por WhatsApp y con gusto te asistimos.

  - ref: real-account-data-is-not-hallucination
    # Same customer asking a related, legitimate question — the agent correctly citing the
    # real outstanding balance from context must NOT be flagged as an invented fact, even
    # though that exact figure never appears in the `expected` reference reply below.
    account:
      fullName: "Ana Martínez"
      principalAmount: 3500
      outstandingBalance: 3500
      daysPastDue: 15
    turns:
      - input: "¿Y cuánto es lo que debo exactamente?"
        expected:
          action: reply
          text:
            type: SIMILAR
            response: "Con gusto te confirmo el monto pendiente de tu cuenta."
